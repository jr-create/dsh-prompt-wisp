# dsh-prompt-wisp bundle patch.
#
# Inserts the plugin row into the web profile roster. `dsh.bundle.patch` in
# package.json points here, which is what makes the package a real DSH bundle
# rather than a plain dependency.
#
#   dsh plugin --profile web add link:<abs-path>   # local development
#
# The row id must match the Host plugin's `export const name` in lib/index.js.
#
# The host half registers:
#   - /api/dsh-prompt-wisp/*  HTTP routes used by the browser half
#     (model resolution, prompt optimization through the host's own LLM
#     runtime, and health status).
#
# The browser half is declared by the `dsh.client` block in package.json and
# is served from the "./client" export. It contributes one entry to the
# official `conversation.input.right` slot — the compact controls row left of
# the composer's submit action.
- insert:
    - id: prompt-wisp
      name: 'dsh-prompt-wisp'
